<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JurAI - Cadastro de Demanda</title>
    <link rel="icon" type="image/x-icon" href="../../assets/img/favicon.ico">
    <link rel="stylesheet" type="text/css" href="../assets/style.css">
    <script type="module" src="../assets/script/controllers/authController.js"></script>
</head>

<body>
    <header>
        <div class="logo-container">
            <a href="/index.html">
                <img src="../../../assets/img/jurai-light.png" id="jurai-logo" alt="JurAI - Logo">
            </a>
        </div>
    </header>
    <div class="container">
        <aside>
            <nav>
                <ul>
                    <li><a href="../dashboard.html">Visão Geral</a></li>
                    <li><a href="../r/cadastro.html">Cadastrar Cliente</a></li>
                    <li><a href="#">Cadastrar Demanda</a></li>
                    <li><a href="../chatbot.html">Assistente Virtual</a></li>
                    <li><a href="../analise-processual.html">Análise Processual</a></li>
                    <li><a href="../documentos.html">Documentos</a></li>
                    <li><a href="../plano.html">Meu Plano</a></li>
                    <li><a href="../conta.html">Minha Conta</a></li>
                    <li><a href="#" id="logout">Sair</a></li>
                </ul>
            </nav>
        </aside>
        <main>
            <h1>Cadastro de Demanda</h1>

            <section class="main-container">
                <form id="registerDemanda">
                    <div class="container">
                        <div class="form-section">
                            <h2>Informações da Petição</h2>

                            <label for="select-petitioner"> Requerente </label>
                            <select name="petitioner" id="select-petitioner"></select>
                            
                            <label for="identificacao"> Identificação </label>
                            <input type="text" id="identificacao" name="identificacao">

                            <label for="foro"> Foro </label>
                            <input type="text" id="foro" name="foro">

                            <label for="competencia"> Competência </label>
                            <input type="text" id="competencia" name="competencia">

                            <label for="classe"> Classe </label>
                            <input type="text" id="classe" name="classe">

                            <label for="assunto_principal"> Assunto Principal </label>
                            <input type="text" id="assunto_principal" name="assunto_principal">

                            <label for="resumo"> Resumo </label>
                            <textarea id="resumo" name="resumo" placeholder="Resumo do processo..."></textarea>
                        </div>
                        
                        <div class="form-section">
                            <h2>Informações Adicionais</h2>

                            <label for="valor_acao"> Valor da ação (R$) </label>
                            <input type="number" id="valor_acao" name="valor_acao" step="0.01">

                            <label for="status"> Status </label>
                            <input type="text" id="status" name="status">

                            <label>
                                <input type="checkbox" id="pedido_liminar" name="pedido_liminar">
                                Pedido de Liminar/Tutela Antecipada
                            </label>

                            <label>
                                <input type="checkbox" id="segredo_justica" name="segredo_justica">
                                Segredo de Justiça
                            </label>

                            <label>
                                <input type="checkbox" id="dispensa_legal" name="dispensa_legal">
                                Não há recolhimento/Dispensa Legal
                            </label>

                            <label>
                                <input type="checkbox" id="justica_gratuita" name="justica_gratuita">
                                Pedido de Justiça Gratuita
                            </label>

                            <label for="guia_custas"> Guia de Custas </label>
                            <input type="checkbox" id="guia_custas" name="guia_custas">
                        </div>
                    </div>
                    <input type="submit" value="Cadastrar" class="btn-fade">
                </form>
            </section>
        </main>
    </div>
    <footer>
        <p>A inteligência que facilita o processo | <small>© 2025 JurAI</small></p>
    </footer>
    <script src="../../assets/js/themeHandler.js"></script>
    <script src="../assets/script.js"></script>
    <script type="module" src="../assets/script/controllers/cadastroDemandaController.js"></script>
</body>
</html>
